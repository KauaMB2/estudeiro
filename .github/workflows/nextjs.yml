name: CI/CD Pipeline - Next.js (Tests → Build → Notify)

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: "ci-cd-pipeline"
  cancel-in-progress: false

env:
  NODE_VERSION: "20"

jobs:
  # -----------------------
  # Job: Tests
  # Runs in parallel with "build"
  # -----------------------
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.set_status.outputs.test_result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Vitest) - generates HTML report at ./vitestreport/index.html
        id: run_tests
        run: npm run test:unit
        continue-on-error: true

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: ./vitestreport
          retention-days: 7

      - name: Set test job status output
        id: set_status
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "test_result=success" >> $GITHUB_OUTPUT
          else
            echo "test_result=failure" >> $GITHUB_OUTPUT
          fi

  # -----------------------
  # Job: Build
  # Runs in parallel with "tests"
  # -----------------------
  build:
    name: Build Server
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.set_build_status.outputs.build_result }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build do servidor (tsup)
        run: npm run build:server

      - name: Upload da pasta build como artifact
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

      - name: Set build job status output
        id: set_build_status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "build_result=success" >> $GITHUB_OUTPUT
          else
            echo "build_result=failure" >> $GITHUB_OUTPUT
          fi

  # -----------------------
  # Job: Deploy
  # Depends on tests and build
  # -----------------------
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    needs: [tests, build]
    if: needs.tests.outputs.test_result == 'success' && needs.build.outputs.build_result == 'success'
    outputs:
      deploy_result: ${{ steps.set_deploy_status.outputs.deploy_result }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITHUBDEPLOY_KEY }}

      - name: Add VPS host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy to VPS
        id: run_deploy
        run: |
          VPS_USER=${{ secrets.VPS_USER }}
          VPS_HOST=${{ secrets.VPS_HOST }}
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          ssh $VPS_USER@$VPS_HOST << EOF
            set -e
            mkdir -p ~/app
            cd ~/app
            if [ ! -d .git ]; then
              git clone https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            if [ ! -f .env ]; then
              touch .env
              echo "PORT=3001" >> .env
            fi

            docker build -t estudeiro .
            docker stop estudeiro || true
            docker rm estudeiro || true
            docker run -d --network host --name estudeiro --env-file .env estudeiro npm start -- -p 3001
          EOF

      - name: Set deploy job status output
        id: set_deploy_status
        if: always()
        run: |
          if [ "${{ steps.run_deploy.outcome }}" = "success" ]; then
            echo "deploy_result=success" >> $GITHUB_OUTPUT
          else
            echo "deploy_result=failure" >> $GITHUB_OUTPUT
          fi

  # -----------------------
  # Job: Notification
  # Depends on tests, build, deploy
  # Sends an email with the pipeline results
  # -----------------------
  notify:
    name: Send notification email
    runs-on: ubuntu-latest
    needs: [tests, build, deploy]
    if: always()
    steps:
      - name: Checkout (for scripts, optional)
        uses: actions/checkout@v4

      - name: Install required system packages (msmtp)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y msmtp-mta ca-certificates bsd-mailx

      - name: Prepare send-email script
        id: prepare_script
        run: |
          cat > ./send_pipeline_mail.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          if [ -z "${MAIL_TO:-}" ]; then
            echo "ERROR: MAIL_TO is not set"
            exit 2
          fi

          TEST_STATUS="${TEST_STATUS:-unknown}"
          BUILD_STATUS="${BUILD_STATUS:-unknown}"
          SUBJECT="CI Pipeline result: Tests=${TEST_STATUS}, Build=${BUILD_STATUS}, Deploy=${DEPLOY_STATUS}"
          BODY="Pipeline run for ref: ${GITHUB_REPOSITORY}@${GITHUB_SHA:-unknown}\n\nTests: ${TEST_STATUS}\nBuild: ${BUILD_STATUS}\nDeploy: ${DEPLOY_STATUS}\n\nView artifacts in the workflow run."

          MSMPTRC="$(mktemp)"
          chmod 600 "$MSMPTRC"
          cat > "$MSMPTRC" <<MSMTP
          defaults
          tls on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile /tmp/msmtp.log

          account default
          host ${SMTP_HOST:-}
          port ${SMTP_PORT:-587}
          auth on
          user ${SMTP_USER:-}
          password ${SMTP_PASS:-}
          from ${MAIL_FROM:-github-actions@$GITHUB_REPOSITORY}
          MSMTP

          export MSMTP_CONFIG="$MSMPTRC"

          echo -e "Subject: ${SUBJECT}\n\n${BODY}" | msmtp --file="$MSMPTRC" --debug -- "${MAIL_TO}"

          echo "--------- msmtp log ---------"
          sed -n '1,200p' /tmp/msmtp.log || true
          echo "-----------------------------"

          rm -f "$MSMPTRC"
          exit 0
          EOF

          chmod +x ./send_pipeline_mail.sh
          echo "send_pipeline_mail.sh created"

      - name: Prepare variables for email
        id: prepare_vars
        run: |
          echo "TEST_STATUS=${{ needs.tests.outputs.test_result }}" >> $GITHUB_ENV
          echo "BUILD_STATUS=${{ needs.build.outputs.build_result }}" >> $GITHUB_ENV
          echo "DEPLOY_STATUS=${{ needs.deploy.outputs.deploy_result }}" >> $GITHUB_ENV

      - name: Send email (using msmtp)
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TEST_STATUS: ${{ env.TEST_STATUS }}
          BUILD_STATUS: ${{ env.BUILD_STATUS }}
          DEPLOY_STATUS: ${{ env.DEPLOY_STATUS }}
        run: |
          if [ -z "${MAIL_TO:-}" ]; then
            echo "MAIL_TO not set. Skipping email send."
            exit 0
          fi

          ./send_pipeline_mail.sh

      - name: Final status output
        run: |
          echo "Notification step finished. Test result: ${{ needs.tests.outputs.test_result }}, Build result: ${{ needs.build.outputs.build_result }}"
